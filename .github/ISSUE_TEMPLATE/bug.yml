name: Bug report
description: Report something that did not work as expected.
body:
  - type: markdown
    attributes:
      value: Remove credentials and private data from examples and logs. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Runstead version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and chip
      placeholder: macOS 15, Apple M3
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
